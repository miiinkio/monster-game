 while(true){const k=await keyOr(50);const full=ui.shown>=ui.total;if(full&&!fullAt)fullAt=performance.now();

  if(k==='U'&&m.i-c>=0)m.i-=c;else if(k==='D'&&m.i+c<n)m.i+=c;else if(k==='L'&&c>1&&m.i%c>0)m.i--;else if(k==='R'&&c>1&&m.i%c<c-1&&m.i+1<n)m.i++;
  else if(k==='A'){ui.menu=null;return m.i}else if(k==='B'&&o.cancel!==false){ui.menu=null;return -1}
  if(old!==m.i&&m.onMove)m.onMove(m.i);}}
const pickParty=(cancel,prompt)=>choose(G.party.map(nm),{style:'party',cancel,prompt});

function update(){frameN++;
 if(ui.text&&ui.shown<ui.total)ui.shown=Math.min(ui.total,ui.shown+1.5);
 if(B){if(B.lungeT>0)B.lungeT--;if(B.blinkT>0)B.blinkT--;
  for(const m of[B.me,B.foe])if(m){const st=Math.max(.25,m.mhp/60);if(m.dhp>m.hp)m.dhp=Math.max(m.hp,m.dhp-st);else if(m.dhp<m.hp)m.dhp=Math.min(m.hp,m.dhp+st);}}
 if(mode!=='world')return;
 if(pl.moving){pl.prog+=4;if(pl.prog>=T){pl.moving=false;G.x=pl.tx;G.y=pl.ty;pl.prog=0;
   if(tile(G.x,G.y)==='w'&&Math.random()<.1)run(wildBattle);}return;}
 if(busy)return;
 const d=['U','D','L','R'].find(k=>held[k]);
 if(needRelease){if(!d)needRelease=false;return}
 if(!d)return;
 G.dir=d;const tx=G.x+DIR[d][0],ty=G.y+DIR[d][1],ch=tile(tx,ty);
 if('DEY'.includes(ch)){run(()=>door(ch));return}
 if(!SOLID.includes(ch)&&!npcAt(tx,ty)){pl.moving=true;pl.tx=tx;pl.ty=ty;pl.prog=0;pl.step^=1;}
}
function healAll(){G.party.forEach(m=>{m.hp=m.mhp;m.dhp=m.hp})}
async function interact(){const tx=G.x+DIR[G.dir][0],ty=G.y+DIR[G.dir][1];const n=npcAt(tx,ty);if(n)return talk(n);
 const c=tile(tx,ty);if(c==='S')return say(ty<10?'↑ 초록 체육관\n관장: 서진':'새싹마을\n몬스터와 함께 자라는 마을');if('DEY'.includes(c))return door(c);}

 else if(c==='E'){await say('간호사: 몬스터 센터에 오신 걸 환영해요!');healAll();G.bag.ball=Math.max(G.bag.ball,5);G.bag.pot=Math.max(G.bag.pot,3);
  await say('몬스터들을 회복시키고 몬스터볼과 상처약도 채워드렸어요!');await say(save()?'모험 기록도 저장해 두었어요. 또 오세요!':'또 오세요!');}
 else if(c==='Y'){if(G.badge){await say('관장 서진: 넌 이미 초록배지의 주인이야. 이제 도감 완성에 도전해 보렴!');return}
  await say('관장 서진: 여기까지 오다니 제법이구나!');await say('나는 초록 체육관 관장 서진. 내 몬스터들을 이겨 보거라!');
  const r=await battle([mk('jji',10),mk('dol',11),mk('yu',12)],{name:'관장 서진',win:'대단해... 내가 졌다!',smart:true});
  if(r==='win'){G.badge=true;await say('서진: 너에게 초록배지를 주마. 진정한 트레이너로구나!');await say('★ 초록배지를 얻었다! ★');
   await say(`축하합니다! 엔딩입니다!\n잡은 몬스터: ${Object.keys(G.caught).length} / 8종`);await say('계속 모험하며 모든 몬스터를 모아 보자!');save();}
  else if(r==='lose')await whiteout();}
}
async function talk(n){n.dir=OPP[G.dir];
 if(n.team&&!G.beaten[n.id]){for(const l of n.lines)await say(`${n.name}: ${l}`);
  const r=await battle(n.team.map(([id,lv])=>mk(id,lv)),{name:n.name,win:n.win,smart:true});
  if(r==='win'){G.beaten[n.id]=1;G.bag.pot+=2;await say(`${n.name}에게서 상처약 2개를 받았다!`)}else if(r==='lose')await whiteout();return;}
 for(const l of(n.team?[n.after]:n.lines))await say(`${n.name}: ${l}`);}

    if(m.hp<=0||m.hp>=m.mhp){await say('지금은 효과가 없을 것 같다.');continue}G.bag.pot--;const h=Math.min(20,m.mhp-m.hp);m.hp+=h;m.dhp=m.hp;await say(`${nm(m)}의 체력이 ${h} 회복되었다!`);}}

const pre=()=>B.tr?'상대 ':'야생 ';
async function transition(){for(let i=0;i<3;i++){ui.fill=P[3];await sleep(70);ui.fill=null;await sleep(70)}for(let t=1;t<=10;t++){ui.wipe=t/10;await sleep(30)}}
async function endBattle(){await sleep(200);ui.fill=P[3];await sleep(150);ui.fill=null;mode='world';B=null;}
async function wildBattle(){const hi=G.y<10;const tb=hi?[['dol',25],['hwi',20],['poja',15],['jji',15],['yu',15],['hwa',10]]:[['hwi',40],['jji',20],['poja',25],['mong',10],['ssak',5]];
 let r=rnd(100),id=tb[0][0];for(const[k,w]of tb){if(r<w){id=k;break}r-=w}
 const res=await battle([mk(id,hi?5+rnd(5):2+rnd(4))],null);if(res==='lose')await whiteout();}
function pickMove(a,d,smart){const ms=a.moves;if(!smart||Math.random()<.3)return ms[rnd(ms.length)];
 return ms.slice().sort((x,y)=>score(y)-score(x))[0];function score(m){const[t,p]=MV[m];return p*eff(t,SP[d.id].t)*(t===SP[a.id].t?1.5:1)}}
async function battle(team,tr){
 await transition();G.party.forEach(m=>m.dhp=m.hp);
 B={team,foe:team[0],tr,me:G.party.find(m=>m.hp>0),foeShow:true,meShow:false,lungeT:0,blinkT:0,foeDrop:0,meDrop:0,ball:null};
 mode='battle';ui.wipe=0;G.seen[B.foe.id]=1;
 if(tr){await say(`${J(tr.name,'이가')} 승부를 걸어왔다!`);await bsay(`${J(tr.name,'은는')} ${J(nm(B.foe),'을를')} 내보냈다!`)}
 else await say(`앗! 야생의 ${J(nm(B.foe),'이가')} 튀어나왔다!`);
 B.meShow=true;await bsay(`가랏! ${nm(B.me)}!`,500);
 while(true){const me=B.me;
  const a=await choose(['싸운다','가방','몬스터','도망'],{x:232,y:288,w:248,h:144,cols:2,cancel:false,prompt:`${J(nm(me),'은는')} 무엇을 할까?`});
  if(a===0){const mi=await choose(me.moves,{x:0,y:288,w:480,h:144,cols:2,info:i=>{const[t,p]=MV[me.moves[i]];return[`타입 / ${t}`,`위력 ${p}`]}});if(mi<0)continue;await turn(me.moves[mi]);}
  else if(a===1){const r=await bagBattle();if(r==='cancel'||r==='noturn')continue;if(r==='caught'){await endBattle();return'caught'}await turn(null);}
  else if(a===2){const i=await pickParty(true,'교체할 몬스터를 고르세요');if(i<0)continue;const m=G.party[i];
   if(m===B.me){await bsay('이미 싸우고 있다!');continue}if(m.hp<=0){await bsay('기절해서 싸울 수 없다!');continue}
   B.meShow=false;await bsay(`돌아와, ${nm(B.me)}!`,500);B.me=m;B.meShow=true;await bsay(`가랏! ${nm(m)}!`,500);await turn(null);}
  else{if(tr){await bsay('트레이너와의 승부에서는 도망칠 수 없다!');continue}
   if(Math.random()<(me.spd>=B.foe.spd?1:.6)){await bsay('무사히 도망쳤다!',600);await endBattle();return'run'}
   await bsay('도망칠 수 없었다!');await turn(null);}
  const r=await afterTurn();if(r){await endBattle();return r}}
}
async function turn(mv){const fm=pickMove(B.foe,B.me,B.tr&&B.tr.smart);
 if(mv){const meFirst=B.me.spd>B.foe.spd||(B.me.spd===B.foe.spd&&Math.random()<.5);
  const seq=meFirst?[[B.me,B.foe,mv,false],[B.foe,B.me,fm,true]]:[[B.foe,B.me,fm,true],[B.me,B.foe,mv,false]];
  for(const[a,d,m,f]of seq){if(a.hp<=0||d.hp<=0)break;await attack(a,d,m,f)}}
 else await attack(B.foe,B.me,fm,true);}
async function waitHp(m){while(Math.abs(m.dhp-m.hp)>.01)await sleep(16)}
async function attack(a,d,mv,isFoe){const name=(isFoe?pre():'')+nm(a);await bsay(`${name}의 ${mv}!`,350);
 B.lunge=isFoe?'foe':'me';B.lungeT=10;await sleep(180);
 if(Math.random()>.95){await bsay('그러나 공격은 빗나갔다!');return}
 const[t,pow]=MV[mv],e=eff(t,SP[d.id].t);if(e===0){await bsay('효과가 없는 것 같다...');return}
 const crit=Math.random()<1/16,stab=t===SP[a.id].t?1.5:1;
 let dmg=Math.floor(Math.floor((2*a.lv/5+2)*pow*a.atk/d.def)/50)+2;dmg=Math.max(1,Math.floor(dmg*stab*e*(crit?1.5:1)*(.85+Math.random()*.15)));
 B.blink=isFoe?'me':'foe';B.blinkT=24;await sleep(350);d.hp=Math.max(0,d.hp-dmg);await waitHp(d);
 if(crit)await bsay('급소에 맞았다!');if(e>1)await bsay('효과가 굉장했다!');else if(e<1)await bsay('효과가 별로인 듯하다...');
 if(mv==='흡수'&&a.hp>0){const h=Math.min(a.mhp-a.hp,Math.ceil(dmg/2));if(h>0){a.hp+=h;await waitHp(a);await bsay(`${J(name,'은는')} 체력을 흡수했다!`)}}}
async function drop(who){for(let i=0;i<=8;i++){B[who+'Drop']=i*14;await sleep(25)}B[who+'Show']=false;B[who+'Drop']=0;}
async function gainExp(m,foe){const g=Math.floor(SP[foe.id].exp*foe.lv/3*(B.tr?1.5:1));m.exp+=g;await bsay(`${J(nm(m),'은는')} 경험치를 ${g} 얻었다!`);
 while(m.lv<50&&m.exp>=(m.lv+1)**3){const old=m.mhp;m.lv++;calc(m);m.hp+=m.mhp-old;m.dhp=m.hp;await say(`${J(nm(m),'은는')} 레벨업했다! (Lv.${m.lv})`);
  for(const[l,mv]of SP[m.id].learn)if(l===m.lv&&!m.moves.includes(mv)){if(m.moves.length<4){m.moves.push(mv);await say(`${J(nm(m),'은는')} 새로 ${J(mv,'을를')} 배웠다!`)}
   else{let wi=0;m.moves.forEach((x,i)=>{if(MV[x][1]<MV[m.moves[wi]][1])wi=i});const o=m.moves[wi];m.moves[wi]=mv;await say(`${J(nm(m),'은는')} ${J(o,'을를')} 잊고 ${J(mv,'을를')} 배웠다!`)}}}}
async function afterTurn(){
 if(B.foe.hp<=0){await drop('foe');await bsay(`${pre()}${J(nm(B.foe),'은는')} 쓰러졌다!`);if(B.me.hp>0)await gainExp(B.me,B.foe);
  const next=B.team.find(m=>m.hp>0);
  if(next){B.foe=next;G.seen[next.id]=1;B.foeShow=true;await bsay(`${J(B.tr.name,'은는')} ${J(nm(next),'을를')} 내보냈다!`)}
  else{if(B.tr){await bsay(`${J(B.tr.name,'과와')}의 승부에서 이겼다!`);await say(`${B.tr.name}: ${B.tr.win}`)}return'win'}}
 if(B.me.hp<=0){await drop('me');await bsay(`${J(nm(B.me),'은는')} 쓰러졌다!`);
  if(G.party.some(m=>m.hp>0)){let i;do{i=await pickParty(false,'다음 몬스터를 고르세요')}while(G.party[i].hp<=0);B.me=G.party[i];B.meShow=true;await bsay(`가랏! ${nm(B.me)}!`,500)}
  else{await say('싸울 수 있는 몬스터가 없다!');await say('눈앞이 캄캄해졌다...');return'lose'}}
 return null;}
async function bagBattle(){const i=await choose([`몬스터볼 x${G.bag.ball}`,`상처약 x${G.bag.pot}`],{x:200,y:160,w:272,prompt:'무엇을 사용할까?'});
 if(i<0)return'cancel';
 if(i===0){if(G.bag.ball<=0){await bsay('몬스터볼이 없다!');return'noturn'}if(B.tr){await bsay('남의 몬스터는 잡을 수 없다!');return'noturn'}G.bag.ball--;return throwBall();}
 if(G.bag.pot<=0){await bsay('상처약이 없다!');return'noturn'}const p=await pickParty(true,'누구에게 사용할까?');if(p<0)return'cancel';const m=G.party[p];
 if(m.hp<=0||m.hp>=m.mhp){await bsay('지금은 효과가 없을 것 같다.');return'noturn'}G.bag.pot--;const h=Math.min(20,m.mhp-m.hp);m.hp+=h;if(m===B.me)await waitHp(m);else m.dhp=m.hp;
 await bsay(`${nm(m)}의 체력이 ${h} 회복되었다!`);return'used';}
async function throwBall(){await bsay('몬스터볼을 던졌다!',250);
 for(let i=0;i<=14;i++){const t=i/14;B.ball={x:90+260*t,y:230-130*t-Math.sin(t*Math.PI)*90,wob:0};await sleep(25)}
 B.foeShow=false;await sleep(300);B.ball.y=96;
 const f=B.foe,rate=Math.min(.95,SP[f.id].cr*(1-2/3*f.hp/f.mhp)*1.4),ok=Math.random()<rate,w=ok?3:rnd(3);
 for(let i=0;i<w;i++){B.ball.wob=-1;await sleep(180);B.ball.wob=1;await sleep(180);B.ball.wob=0;await sleep(350)}
 if(ok){await say(`신난다! ${J(nm(f),'을를')} 잡았다!`);G.caught[f.id]=1;f.dhp=f.hp;
  if(G.party.length<6)G.party.push(f);else{G.box.push(f);await say(`${J(nm(f),'은는')} 보관함으로 보내졌다.`)}return'caught';}
 B.ball=null;B.foeShow=true;await bsay(['아앗! 몬스터가 바로 빠져나왔다!','아깝다! 거의 잡았는데!','안 돼! 잡았다고 생각했는데!'][w]);return'used';}

function txt(s,x,y,size=26,c=3,al='left'){ctx.font=F(size);ctx.fillStyle=P[c];ctx.textAlign=al;ctx.textBaseline='top';ctx.fillText(s,x,y);ctx.textAlign='left';}
function box(x,y,w,h){ctx.fillStyle=P[3];ctx.fillRect(x,y,w,h);ctx.fillStyle=P[0];ctx.fillRect(x+4,y+4,w-8,h-8);ctx.strokeStyle=P[2];ctx.lineWidth=2;ctx.strokeRect(x+9,y+9,w-18,h-18);}
function cursor(x,y){ctx.fillStyle=P[3];ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+12,y+8);ctx.lineTo(x,y+16);ctx.fill();}
function hpBar(x,y,w,r){r=Math.max(0,Math.min(1,r));ctx.fillStyle=P[3];ctx.fillRect(x-2,y-2,w+4,14);ctx.fillStyle=P[0];ctx.fillRect(x,y,w,10);ctx.fillStyle=r>.5?P[2]:r>.2?P[1]:P[3];ctx.fillRect(x,y,Math.round(w*r),10);}
function drawTextBox(){box(0,288,480,144);let left=Math.floor(ui.shown);ui.lines.forEach((l,i)=>{if(left<=0)return;txt(l.slice(0,left),24,308+i*38);left-=l.length});
 if(ui.shown>=ui.total&&(frameN>>4)%2){ctx.fillStyle=P[3];ctx.beginPath();ctx.moveTo(440,404);ctx.lineTo(456,404);ctx.lineTo(448,414);ctx.fill();}}

 if(m.style==='party'){ctx.fillStyle=P[0];ctx.fillRect(0,0,W,288);
  G.party.forEach((p,i)=>{const y=6+i*46;spr(SP[p.id].spr,44,y+6,2);txt(nm(p)+(p.hp<=0?' (기절)':''),90,y+6,22);txt(`Lv${p.lv}`,226,y+6,22);hpBar(300,y+10,150,p.hp/p.mhp);txt(`${p.hp}/${p.mhp}`,300,y+24,18);if(i===m.i)cursor(16,y+12);});
  box(0,288,480,144);wrap(m.prompt||'',430,26).forEach((l,i)=>txt(l,24,308+i*38));return;}
 const c=m.cols,rows=Math.ceil(m.opts.length/c),w=m.w||200,h=m.h||rows*40+32,x=m.x,y=m.y;
 if(m.prompt){box(0,288,480,144);wrap(m.prompt,y>=288?190:430,26).forEach((l,i)=>txt(l,24,308+i*38));}
 box(x,y,w,h);const cw=(w-24)/c,oy=Math.max(16,(h-rows*40)/2+6);
 m.opts.forEach((o,i)=>{const cx=x+40+(i%c)*cw,cy=y+oy+Math.floor(i/c)*40;txt(o,cx,cy,c>1&&w>400?24:26);if(i===m.i)cursor(cx-22,cy+5)});
 if(m.info){const s=m.info(m.i);box(296,196,184,92);txt(s[0],318,212,22);txt(s[1],318,244,22);}}
function drawWorld(){const p=pl.moving?pl.prog:0,dx=DIR[G.dir][0],dy=DIR[G.dir][1];const wx=G.x*T+dx*p,wy=G.y*T+dy*p,cx=wx-192,cy=wy-192;
 const tx0=Math.floor(cx/T),ty0=Math.floor(cy/T),f=(frameN>>5)&1;
 for(let ty=ty0;ty<=ty0+9;ty++)for(let tx=tx0;tx<=tx0+10;tx++){const c=tile(tx,ty);const img=c==='~'?WATER[f]:c==='F'?FLOWER[f]:TL[c];ctx.drawImage(img,tx*T-cx,ty*T-cy,T,T);}
 for(const n of NPCS)spr(person(n.dir,'stand',true),n.x*T-cx,n.y*T-cy-6,3,n.dir==='R');
 const legs=pl.moving&&p<24?(pl.step?'a':'b'):'stand';spr(person(G.dir,legs,false),192,186,3,G.dir==='R');
 const gx=Math.round(wx/T),gy=Math.round(wy/T);if(tile(gx,gy)==='w')ctx.drawImage(TL.w,0,9,16,7,gx*T-cx,gy*T-cy+27,48,21);}
function drawBattle(){const b=B;ctx.fillStyle=P[1];ctx.beginPath();ctx.ellipse(358,124,90,14,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(100,262,104,16,0,0,7);ctx.fill();
 const lo=w=>b.lunge===w&&b.lungeT>0?Math.sin(b.lungeT/10*Math.PI)*18:0,vis=w=>!(b.blink===w&&b.blinkT>0&&(b.blinkT>>2)%2===0);
 if(b.foeShow&&vis('foe')){ctx.save();ctx.beginPath();ctx.rect(0,0,W,128);ctx.clip();spr(SP[b.foe.id].spr,310-lo('foe'),28+b.foeDrop,6,false);ctx.restore();}
 if(b.meShow&&b.me&&vis('me')){ctx.save();ctx.beginPath();ctx.rect(0,0,W,266);ctx.clip();spr(SP[b.me.id].spr,40+lo('me'),150+b.meDrop,7,true);ctx.restore();}
 if(b.ball){ctx.save();ctx.translate(b.ball.x+16,b.ball.y+16);ctx.rotate(b.ball.wob*.35);spr(BALL,-16,-16,4);ctx.restore();}
 const f=b.foe;txt(nm(f),28,20,26);txt(`Lv${f.lv}`,196,22,22);txt('HP',34,56,18);hpBar(68,60,170,f.dhp/f.mhp);ctx.fillStyle=P[3];ctx.fillRect(22,50,4,32);ctx.fillRect(22,80,230,4);
 const m=b.me;if(m&&b.meShow){txt(nm(m),258,180,26);txt(`Lv${m.lv}`,400,182,22);txt('HP',260,216,18);hpBar(294,220,164,m.dhp/m.mhp);txt(`${Math.ceil(m.dhp)}/ ${m.mhp}`,330,238,22);ctx.fillRect(464,210,4,62);ctx.fillRect(246,268,222,4);}
 if(!ui.text&&!ui.menu)box(0,288,480,144);}
function drawTitle(){for(let x=0;x<10;x++){ctx.drawImage(TL.w,x*T,384,T,T);ctx.drawImage(TL.T,x*T,0,T,T)}
 txt('몬스터 모험',240,64,72,3,'center');txt('~ 초록판 ~',240,140,30,2,'center');
 const ids=Object.keys(SP);spr(SP[ids[(frameN/150|0)%ids.length]].spr,184,184,7);
 if(!ui.menu&&(frameN>>5)%2)txt('A 또는 START를 누르세요',240,340,26,3,'center');}
function drawIntro(){if(ui.preview){spr(SP[ui.preview].spr,40,24,8);txt(`${SP[ui.preview].n} · ${SP[ui.preview].t} 타입`,104,166,26,3,'center')}else spr(person('D','stand',true),168,40,9);}
function render(){ctx.fillStyle=P[0];ctx.fillRect(0,0,W,H);
 if(mode==='title')drawTitle();else if(mode==='intro')drawIntro();else if(mode==='world')drawWorld();else if(mode==='battle'&&B)drawBattle();
 if(ui.text)drawTextBox();if(ui.menu)drawMenu(ui.menu);
 if(ui.wipe){ctx.fillStyle=P[3];const h=ui.wipe*H/2;ctx.fillRect(0,0,W,h);ctx.fillRect(0,H-h,W,h)}
 if(ui.fill){ctx.fillStyle=ui.fill;ctx.fillRect(0,0,W,H)}}
function loop(){update();render();requestAnimationFrame(loop)}

/* ---------- 시작 ---------- */
async function newGame(){G=newG();mode='intro';ui.preview=null;
 await say('안녕! 몬스터의 세계에 온 것을 환영한단다!');await say('나는 새싹마을의 몬스터 박사, 송 박사란다.');
 await say('이 세상에는 몬스터라 불리는 신기한 생물들이 살고 있지.');await say('자, 함께 모험할 첫 번째 몬스터를 골라 보렴!');
 const ids=['hwa','mong','ssak'];let id;
 while(true){const i=await choose(ids.map(k=>SP[k].n),{x:248,y:110,w:224,cancel:false,prompt:'어떤 몬스터로 할까?',onMove:j=>ui.preview=ids[j]});id=ids[i];
  const ok=await choose(['예','아니오'],{x:330,y:170,w:140,cancel:false,prompt:`${SP[id].n}(${SP[id].t} 타입)로 정할까?`});if(ok===0)break;}
 G.party.push(mk(id,5));G.caught[id]=1;G.seen[id]=1;
 await say(`${J(SP[id].n,'을를')} 받았다!`);ui.preview=null;
 await say('북쪽 끝 초록 체육관의 관장 서진을 이기면 진정한 트레이너가 될 수 있단다.');
 await say('풀숲에서 몬스터를 잡고 키워 보렴. 다치면 몬스터 센터(+)에 가면 돼. 행운을 빈다!');
 mode='world';save();}
async function boot(){mode='title';while(true){const k=await keyOr(0);if(k==='A'||k==='S')break}
 const s=loadRaw();if(s&&s.party&&s.party.length){const i=await choose(['이어하기','새로 시작'],{x:140,y:290,w:200,cancel:false});
  if(i===0){G=Object.assign(newG(),s);G.party.forEach(m=>m.dhp=m.hp);mode='world';return}}
 await newGame();}
loop();
Promise.race([document.fonts.load(F(26)),sleep(1500)]).finally(()=>run(boot));
</script></body></html>
